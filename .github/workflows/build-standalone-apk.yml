name: Build Standalone APK

on:
  push:
    paths:
      - 'build_payload/**'
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: false
        default: 'Web App'
      package_id:
        description: 'Package ID'
        required: false
        default: 'com.example.standalone'
      splash_color:
        description: 'Splash Screen Color (#1E1E1E or #FFFFFF)'
        required: false
        default: '#1E1E1E'

permissions:
  contents: write

jobs:
  build:
    name: Compile Standalone Web APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Project Template (if needed)
        run: |
          if [ ! -f app/build.gradle ]; then
            echo "Base project files not found in repo root. Checking for payload template..."
            if [ -f build_payload/template.zip ]; then
              python3 -c "
          import zipfile, os
          with zipfile.ZipFile('build_payload/template.zip', 'r') as z:
              for info in z.infolist():
                  clean = info.filename.replace(chr(92), '/')
                  if clean.endswith('/'):
                      os.makedirs(clean, exist_ok=True)
                  else:
                      dir_name = os.path.dirname(clean)
                      if dir_name:
                          os.makedirs(dir_name, exist_ok=True)
                      with open(clean, 'wb') as f:
                          f.write(z.read(info.filename))
          print('Extracted template successfully!')
          "
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Standalone App (Inject HTML, Icon, Name, Splash)
        run: |
          mkdir -p app/src/main/assets/standalone_app
          pip install --quiet pillow || true

          python3 -c "
          import json, base64, os

          # 1. Read Payload
          payload_path = 'build_payload/payload.json'
          if os.path.exists(payload_path):
              with open(payload_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
          else:
              data = {}

          app_name = data.get('app_name', 'Web App')
          package_id = data.get('package_id', 'com.example.standalone')
          splash_color = data.get('splash_color', '#1E1E1E')
          html_content = data.get('html_content', '<h1>Hello World</h1>')
          icon_base64 = data.get('icon_base64', '')

          # 2. Write HTML
          with open('app/src/main/assets/standalone_app/index.html', 'w', encoding='utf-8') as f:
              f.write(html_content)
          print('Injected HTML content')

          # 3. Update App Name in strings.xml
          strings_path = 'app/src/main/res/values/strings.xml'
          if os.path.exists(strings_path):
              with open(strings_path, 'r', encoding='utf-8') as f:
                  strings = f.read()
              strings = strings.replace('HTML Editor', app_name)
              with open(strings_path, 'w', encoding='utf-8') as f:
                  f.write(strings)
              print('Updated app name to:', app_name)

          # 4. Update Package ID if valid
          if package_id and package_id != 'com.example.htmleditor':
              bg_path = 'app/build.gradle'
              if os.path.exists(bg_path):
                  with open(bg_path, 'r', encoding='utf-8') as f:
                      bg = f.read()
                  bg = bg.replace('applicationId \"com.example.htmleditor\"', f'applicationId \"{package_id}\"')
                  with open(bg_path, 'w', encoding='utf-8') as f:
                      f.write(bg)
                  print('Updated package ID to:', package_id)

          # 5. Decode and resize custom icon
          if icon_base64:
              try:
                  with open('custom_icon.png', 'wb') as f:
                      f.write(base64.b64decode(icon_base64))
                  from PIL import Image
                  im = Image.open('custom_icon.png')
                  sizes = [
                      (48, 'app/src/main/res/mipmap-mdpi/ic_launcher.png'),
                      (72, 'app/src/main/res/mipmap-hdpi/ic_launcher.png'),
                      (96, 'app/src/main/res/mipmap-xhdpi/ic_launcher.png'),
                      (144, 'app/src/main/res/mipmap-xxhdpi/ic_launcher.png'),
                      (192, 'app/src/main/res/mipmap-xxxhdpi/ic_launcher.png'),
                  ]
                  for s, path in sizes:
                      os.makedirs(os.path.dirname(path), exist_ok=True)
                      im.resize((s, s)).save(path)
                  print('Resized custom icon successfully')
              except Exception as e:
                  print('Could not resize icon:', e)

          # 6. Switch Launcher activity to StandaloneAppActivity in AndroidManifest.xml
          manifest_path = 'app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  manifest = f.read()

              filter_block = '''<intent-filter>
                      <action android:name=\"android.intent.action.MAIN\" />
                      <category android:name=\"android.intent.category.LAUNCHER\" />
                  </intent-filter>'''

              manifest = manifest.replace(filter_block, '')
              target = '<activity\n            android:name=\".StandaloneAppActivity\"\n            android:exported=\"false\"'
              replacement = '<activity\n            android:name=\".StandaloneAppActivity\"\n            android:exported=\"true\">\n            ' + filter_block + '\n        </activity>'

              manifest = manifest.replace(target + '\n            android:configChanges=\"orientation|screenSize|keyboardHidden\" />', replacement)

              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(manifest)
              print('Configured StandaloneAppActivity as main launcher')

          # 7. Export fingerprint to GITHUB_ENV if present
          fingerprint = data.get('fingerprint', '')
          if 'GITHUB_ENV' in os.environ and fingerprint:
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as ef:
                  ef.write(f'BUILD_FINGERPRINT={fingerprint}\n')
          "

      - name: Generate Gradle wrapper jar (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Standalone APK
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties || true
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p outputs
          cp app/build/outputs/apk/debug/app-debug.apk outputs/standalone-app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-app-apk
          path: outputs/standalone-app.apk
          if-no-files-found: error

      - name: Publish Standalone APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: standalone-build-${{ github.run_number }}
          name: "Standalone App Build #${{ github.run_number }}"
          body: "Fingerprint: ${{ env.BUILD_FINGERPRINT }}"
          files: outputs/standalone-app.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
