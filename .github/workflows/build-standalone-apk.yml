name: Build Standalone APK

on:
  push:
    paths:
      - 'build_payload/**'
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: false
        default: 'Web App'
      package_id:
        description: 'Package ID'
        required: false
        default: 'com.example.standalone'
      splash_color:
        description: 'Splash Screen Color (#1E1E1E or #FFFFFF)'
        required: false
        default: '#1E1E1E'

permissions:
  contents: write

jobs:
  build:
    name: Compile Standalone Web APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Project Template (if needed)
        run: |
          if [ ! -f app/build.gradle ]; then
            echo "Base project files not found in repo root. Checking for payload template..."
            if [ -f build_payload/template.zip ]; then
              python3 -c "
          import zipfile, os
          with zipfile.ZipFile('build_payload/template.zip', 'r') as z:
              for info in z.infolist():
                  clean = info.filename.replace(chr(92), '/')
                  if clean.endswith('/'):
                      os.makedirs(clean, exist_ok=True)
                  else:
                      dir_name = os.path.dirname(clean)
                      if dir_name:
                          os.makedirs(dir_name, exist_ok=True)
                      with open(clean, 'wb') as f:
                          f.write(z.read(info.filename))
          print('Extracted template successfully!')
          "
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Standalone App (Inject HTML, Icon, Name, Splash)
        run: |
          mkdir -p app/src/main/assets/standalone_app
          pip install --quiet pillow || true

          python3 - << 'EOF'
          import json
          import base64
          import os
          import re

          # 1. Read Payload
          payload_path = 'build_payload/payload.json'
          if os.path.exists(payload_path):
              with open(payload_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
          else:
              data = {}

          app_name = data.get('app_name', 'Web App')
          package_id = data.get('package_id', 'com.app.standalone')
          splash_color = data.get('splash_color', '#1E1E1E')
          html_content = data.get('html_content', '<h1>Hello World</h1>')
          icon_base64 = data.get('icon_base64', '')
          fingerprint = data.get('fingerprint', '')
          project_zip_b64 = data.get('project_zip_base64', '')
          permissions_list = data.get('permissions', ['INTERNET'])
          project_type = data.get('project_type', 'html')

          # 2. Extract Project Assets or HTML into assets/standalone_app/
          os.makedirs('app/src/main/assets/standalone_app', exist_ok=True)
          if project_zip_b64:
              import io, zipfile
              try:
                  zip_bytes = base64.b64decode(project_zip_b64)
                  with zipfile.ZipFile(io.BytesIO(zip_bytes)) as z:
                      z.extractall('app/src/main/assets/standalone_app')
                  print('Successfully unpacked entire project files into assets/standalone_app!')
              except Exception as e:
                  print('Error extracting project ZIP:', e)
                  with open('app/src/main/assets/standalone_app/index.html', 'w', encoding='utf-8') as f:
                      f.write(html_content)
          else:
              with open('app/src/main/assets/standalone_app/index.html', 'w', encoding='utf-8') as f:
                  f.write(html_content)
              print('Injected HTML content into assets/standalone_app/index.html')

          # 2b. If Jetpack Compose project, inject custom Kotlin files and resource files into source set
          has_kt_files = False
          for root, dirs, files in os.walk('app/src/main/assets/standalone_app'):
              if any(f.endswith('.kt') for f in files):
                  has_kt_files = True
                  break

          is_compose = (project_type == 'compose') or has_kt_files
          if is_compose:
              for root, dirs, files in os.walk('app/src/main/assets/standalone_app'):
                  for f in files:
                      if f.endswith('.kt'):
                          src_file = os.path.join(root, f)
                          rel = os.path.relpath(src_file, 'app/src/main/assets/standalone_app')
                          if rel.startswith('src' + os.sep) or rel.startswith('src/'):
                              rel = rel[4:]
                          target_file = os.path.join('app/src/main/java/com/example/htmleditor', rel)
                          with open(src_file, 'r', encoding='utf-8') as kf:
                              code = kf.read()

                          # Calculate subpackage based on directory structure
                          rel_clean = rel.replace('\\', '/')
                          rel_dir = os.path.dirname(rel_clean).strip('/')
                          if rel_dir:
                              sub_pkg = rel_dir.replace('/', '.')
                              target_pkg = f'com.example.htmleditor.{sub_pkg}'
                          else:
                              target_pkg = 'com.example.htmleditor'

                          # Find original package if defined
                          orig_pkg_match = re.search(r'package\s+([\w\.]+)', code)
                          if orig_pkg_match:
                              orig_pkg = orig_pkg_match.group(1)
                              if orig_pkg != target_pkg:
                                  # Replace package declaration
                                  code = re.sub(r'package\s+[\w\.]+', f'package {target_pkg}', code, count=1)
                                  # Update any internal imports referencing the old base package
                                  code = re.sub(r'\bimport\s+' + re.escape(orig_pkg) + r'\b', 'import com.example.htmleditor', code)
                          else:
                              code = f'package {target_pkg}\n\n' + code

                          code = code.replace('horizontalAlignment = Alignment.CenterVertically', 'horizontalAlignment = Alignment.CenterHorizontally')

                          # Auto-fix missing imports for Compose in MainActivity or screen files
                          if f == 'MainActivity.kt' or not rel_dir:
                              required_imports = [
                                  "import androidx.activity.ComponentActivity",
                                  "import androidx.activity.compose.setContent",
                                  "import androidx.compose.foundation.layout.*",
                                  "import androidx.compose.material.icons.Icons",
                                  "import androidx.compose.material.icons.filled.*",
                                  "import androidx.compose.material3.*",
                                  "import androidx.compose.runtime.*",
                                  "import androidx.compose.ui.Alignment",
                                  "import androidx.compose.ui.Modifier",
                                  "import androidx.compose.ui.graphics.Color",
                                  "import androidx.compose.ui.unit.dp",
                                  "import androidx.compose.ui.unit.sp",
                                  "import androidx.lifecycle.ViewModel",
                                  "import androidx.lifecycle.viewModelScope",
                                  "import androidx.lifecycle.viewmodel.compose.viewModel",
                                  "import kotlinx.coroutines.launch",
                                  "import kotlinx.coroutines.delay"
                              ]
                              missing_imports = [imp for imp in required_imports if imp not in code]
                              if missing_imports:
                                  code = re.sub(r'(package\s+[\w\.]+\n)', r'\1\n' + '\n'.join(missing_imports) + '\n', code, count=1)

                          os.makedirs(os.path.dirname(target_file), exist_ok=True)
                          with open(target_file, 'w', encoding='utf-8') as kf:
                              kf.write(code)
                          print(f'Injected Compose source file: {rel} (package: {target_pkg})')

              # Guarantee fallback Theme.kt exists so any import of AppTheme succeeds
              fallback_theme = 'app/src/main/java/com/example/htmleditor/ui/theme/Theme.kt'
              if not os.path.exists(fallback_theme):
                  os.makedirs(os.path.dirname(fallback_theme), exist_ok=True)
                  theme_lines = [
                      "package com.example.htmleditor.ui.theme",
                      "",
                      "import androidx.compose.foundation.isSystemInDarkTheme",
                      "import androidx.compose.material3.*",
                      "import androidx.compose.runtime.Composable",
                      "import androidx.compose.ui.graphics.Color",
                      "import androidx.compose.ui.text.TextStyle",
                      "import androidx.compose.ui.text.font.FontFamily",
                      "import androidx.compose.ui.text.font.FontWeight",
                      "import androidx.compose.ui.unit.sp",
                      "",
                      "val Purple80 = Color(0xFFD0BCFF)",
                      "val PurpleGrey80 = Color(0xFFCCC2DC)",
                      "val Pink80 = Color(0xFFEFB8C8)",
                      "val Purple40 = Color(0xFF6650a4)",
                      "val PurpleGrey40 = Color(0xFF625b71)",
                      "val Pink40 = Color(0xFF7D5260)",
                      "",
                      "val Typography = Typography(",
                      "    bodyLarge = TextStyle(",
                      "        fontFamily = FontFamily.Default,",
                      "        fontWeight = FontWeight.Normal,",
                      "        fontSize = 16.sp,",
                      "        lineHeight = 24.sp,",
                      "        letterSpacing = 0.5.sp",
                      "    )",
                      ")",
                      "",
                      "private val DarkColorScheme = darkColorScheme(primary = Purple80, secondary = PurpleGrey80, tertiary = Pink80)",
                      "private val LightColorScheme = lightColorScheme(primary = Purple40, secondary = PurpleGrey40, tertiary = Pink40)",
                      "",
                      "@Composable",
                      "fun AppTheme(darkTheme: Boolean = isSystemInDarkTheme(), content: @Composable () -> Unit) {",
                      "    val colorScheme = if (darkTheme) DarkColorScheme else LightColorScheme",
                      "    MaterialTheme(colorScheme = colorScheme, typography = Typography, content = content)",
                      "}"
                  ]
                  with open(fallback_theme, 'w', encoding='utf-8') as ftf:
                      ftf.write('\n'.join(theme_lines) + '\n')
                  print('Created fallback ui/theme/Theme.kt with AppTheme')

              # 2c. Intelligently merge custom res/values XMLs from project without overwriting base app resources
              base_colors = {
                  "editor_bg": "#1E1E1E",
                  "toolbar_bg": "#252526",
                  "tab_bar_bg": "#181818",
                  "tab_active_bg": "#1E1E1E",
                  "tab_inactive_bg": "#252526",
                  "tab_inactive_text": "#9E9E9E",
                  "accent": "#4FC3F7",
                  "accent_color": "#4FC3F7",
                  "dialog_bg": "#1E1E24",
                  "white": "#FFFFFF",
                  "black": "#000000",
                  "divider": "#3C3C3C"
              }

              user_colors = {}
              user_strings = {}
              for root, dirs, files in os.walk('app/src/main/assets/standalone_app'):
                  for f in files:
                      f_lower = f.lower()
                      if f_lower == 'colors.xml':
                          src_file = os.path.join(root, f)
                          try:
                              with open(src_file, 'r', encoding='utf-8') as cfile:
                                  c_content = cfile.read()
                                  for m in re.finditer(r'<color\s+name=["\']([^"\']+)["\']>([^<]+)</color>', c_content):
                                      user_colors[m.group(1)] = m.group(2).strip()
                              print(f'Parsed {len(user_colors)} custom colors from project {f}')
                          except Exception as e:
                              print('Error parsing project colors.xml:', e)
                      elif f_lower == 'strings.xml':
                          src_file = os.path.join(root, f)
                          try:
                              with open(src_file, 'r', encoding='utf-8') as sfile:
                                  s_content = sfile.read()
                                  for m in re.finditer(r'<string\s+name=["\']([^"\']+)["\']>([^<]+)</string>', s_content):
                                      user_strings[m.group(1)] = m.group(2).strip()
                              print(f'Parsed {len(user_strings)} custom strings from project {f}')
                          except Exception as e:
                              print('Error parsing project strings.xml:', e)
                      elif f_lower in ['themes.xml', 'styles.xml']:
                          src_file = os.path.join(root, f)
                          try:
                              with open(src_file, 'r', encoding='utf-8') as th_file:
                                  th_content = th_file.read()
                              with open('app/src/main/res/values/themes.xml', 'r', encoding='utf-8') as base_th:
                                  current_th = base_th.read()
                              user_styles = re.findall(r'(<style[\s\S]*?</style>)', th_content)
                              for ust in user_styles:
                                  if 'name="Theme.HtmlEditor"' not in ust and ust not in current_th:
                                      current_th = current_th.replace('</resources>', f'    {ust}\n</resources>')
                              with open('app/src/main/res/values/themes.xml', 'w', encoding='utf-8') as base_th:
                                  base_th.write(current_th)
                              print(f'Merged custom styles from {f} into themes.xml')
                          except Exception as e:
                              print('Error merging themes/styles:', e)
                      elif f.endswith('.xml') and f_lower != 'androidmanifest.xml':
                          src_file = os.path.join(root, f)
                          target_file = os.path.join('app/src/main/res/values', f)
                          os.makedirs(os.path.dirname(target_file), exist_ok=True)
                          with open(src_file, 'r', encoding='utf-8') as sxf:
                              content = sxf.read()
                          with open(target_file, 'w', encoding='utf-8') as txf:
                              txf.write(content)
                          print(f'Injected Resource XML: {f}')

              # Write guaranteed merged colors.xml (combines base UI colors + project custom colors)
              merged_colors = dict(base_colors)
              merged_colors.update(user_colors)
              color_lines = ['<?xml version="1.0" encoding="utf-8"?>', '<resources>']
              for cname, cval in merged_colors.items():
                  color_lines.append(f'    <color name="{cname}">{cval}</color>')
              color_lines.append('</resources>')
              os.makedirs('app/src/main/res/values', exist_ok=True)
              with open('app/src/main/res/values/colors.xml', 'w', encoding='utf-8') as f:
                  f.write('\n'.join(color_lines) + '\n')
              print('Wrote safe merged colors.xml with', len(merged_colors), 'colors')

          # 3. Set App Name and merged strings in strings.xml
          merged_strings = dict(user_strings)
          merged_strings['app_name'] = app_name
          string_lines = ['<?xml version="1.0" encoding="utf-8"?>', '<resources>']
          for sname, sval in merged_strings.items():
              string_lines.append(f'    <string name="{sname}">{sval}</string>')
          string_lines.append('</resources>')
          with open('app/src/main/res/values/strings.xml', 'w', encoding='utf-8') as f:
              f.write('\n'.join(string_lines) + '\n')
          print('Updated app_name to:', app_name, 'and preserved custom strings')

          # 4. Update Package ID (applicationId) & Jetpack Compose Configuration in app/build.gradle
          bg_path = 'app/build.gradle'
          if os.path.exists(bg_path):
              with open(bg_path, 'r', encoding='utf-8') as f:
                  bg = f.read()

              if package_id and package_id != 'com.example.htmleditor':
                  bg = re.sub(r'applicationId\s+["\'][^"\']+["\']', f'applicationId "{package_id}"', bg)
                  print('Updated package ID to:', package_id)

              if is_compose:
                  # Enable compose buildFeature
                  if 'compose true' not in bg:
                      if 'buildFeatures {' in bg:
                          bg = bg.replace('buildFeatures {', 'buildFeatures {\n        compose true')
                      else:
                          bg = bg.replace('android {', 'android {\n    buildFeatures {\n        compose true\n    }')

                  # Add composeOptions
                  if 'composeOptions' not in bg:
                      bg = bg.replace('buildFeatures {', "composeOptions {\n        kotlinCompilerExtensionVersion '1.5.14'\n    }\n    buildFeatures {")

                  # Add all required Jetpack Compose dependencies including Material Icons Extended & ViewModel Compose
                  compose_deps_list = [
                      "implementation 'androidx.activity:activity-compose:1.9.0'",
                      "implementation platform('androidx.compose:compose-bom:2024.04.01')",
                      "implementation 'androidx.compose.ui:ui'",
                      "implementation 'androidx.compose.ui:ui-graphics'",
                      "implementation 'androidx.compose.ui:ui-tooling-preview'",
                      "implementation 'androidx.compose.material3:material3'",
                      "implementation 'androidx.compose.material:material'",
                      "implementation 'androidx.compose.material:material-icons-extended'",
                      "implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0'",
                      "implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.0'",
                      "implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'",
                      "implementation 'androidx.navigation:navigation-compose:2.7.7'",
                      "implementation 'androidx.compose.foundation:foundation'"
                  ]
                  for dep in compose_deps_list:
                      dep_name = dep.split("'")[1]
                      if dep_name not in bg:
                          bg = bg.replace('dependencies {', 'dependencies {\n    ' + dep)

              with open(bg_path, 'w', encoding='utf-8') as f:
                  f.write(bg)
              print('Configured app/build.gradle (is_compose:', is_compose, ')')

          # 5. Handle AndroidManifest.xml: PRESERVE user custom manifest if present in project!
          custom_manifest = None
          for root, dirs, files in os.walk('app/src/main/assets/standalone_app'):
              for f in files:
                  if f.lower() == 'androidmanifest.xml':
                      custom_manifest = os.path.join(root, f)
                      break
              if custom_manifest:
                  break

          launcher_activity = "com.example.htmleditor.MainActivity" if is_compose else "com.example.htmleditor.StandaloneAppActivity"

          if custom_manifest and os.path.exists(custom_manifest):
              with open(custom_manifest, 'r', encoding='utf-8') as cmf:
                  user_manifest = cmf.read()

              # Self-heal 1: AGP 8.0+ strictly forbids package attribute in source AndroidManifest.xml
              user_manifest = re.sub(r'\s+package\s*=\s*["\'][^"\']*["\']', '', user_manifest)

              # Self-heal 2: Ensure required XML namespaces are present
              if 'xmlns:android=' not in user_manifest:
                  user_manifest = user_manifest.replace('<manifest', '<manifest xmlns:android="http://schemas.android.com/apk/res/android"', 1)
              if 'xmlns:tools=' not in user_manifest:
                  user_manifest = user_manifest.replace('<manifest', '<manifest xmlns:tools="http://schemas.android.com/tools"', 1)

              # Self-heal 3: Normalize launcher activity class to matching compiled launcher
              user_manifest = re.sub(r'android:name\s*=\s*["\'][\w\.]*MainActivity["\']', f'android:name="{launcher_activity}"', user_manifest)

              # Self-heal 4: Ensure launcher activity has android:exported="true" (mandatory since Android 12)
              if '<intent-filter>' in user_manifest and 'android:exported=' not in user_manifest:
                  user_manifest = user_manifest.replace('<activity', '<activity android:exported="true"', 1)

              # Self-heal 5: Ensure application has a valid theme
              if 'android:theme=' not in user_manifest:
                  user_manifest = user_manifest.replace('<application', '<application android:theme="@style/Theme.HtmlEditor"', 1)

              with open('app/src/main/AndroidManifest.xml', 'w', encoding='utf-8') as f:
                  f.write(user_manifest)
              print('Preserved, self-healed, and applied user custom AndroidManifest.xml successfully!')
          else:
              # Fallback to generated manifest with dynamic permissions
              if not permissions_list:
                  permissions_list = ['INTERNET']

              perm_lines = []
              feat_lines = []

              if 'INTERNET' in permissions_list:
                  perm_lines.append('    <uses-permission android:name="android.permission.INTERNET" />')
                  perm_lines.append('    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />')

              if 'LOCATION' in permissions_list:
                  perm_lines.append('    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />')
                  perm_lines.append('    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />')
                  feat_lines.append('    <uses-feature android:name="android.hardware.location.gps" android:required="false" />')

              if 'CAMERA' in permissions_list:
                  perm_lines.append('    <uses-permission android:name="android.permission.CAMERA" />')
                  feat_lines.append('    <uses-feature android:name="android.hardware.camera" android:required="false" />')
                  feat_lines.append('    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />')

              if 'AUDIO' in permissions_list:
                  perm_lines.append('    <uses-permission android:name="android.permission.RECORD_AUDIO" />')
                  perm_lines.append('    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />')
                  feat_lines.append('    <uses-feature android:name="android.hardware.microphone" android:required="false" />')

              if 'STORAGE' in permissions_list:
                  perm_lines.append('    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />')
                  perm_lines.append('    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />')
                  perm_lines.append('    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />')
                  perm_lines.append('    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />')

              launcher_activity = "com.example.htmleditor.MainActivity" if is_compose else "com.example.htmleditor.StandaloneAppActivity"

              manifest_lines = [
                  '<?xml version="1.0" encoding="utf-8"?>',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"',
                  '    xmlns:tools="http://schemas.android.com/tools">',
                  ''
              ] + perm_lines + [''] + feat_lines + [
                  '',
                  '    <application',
                  '        android:allowBackup="true"',
                  '        android:icon="@mipmap/ic_launcher"',
                  '        android:roundIcon="@mipmap/ic_launcher_round"',
                  '        android:label="@string/app_name"',
                  '        android:theme="@style/Theme.HtmlEditor"',
                  '        android:usesCleartextTraffic="true"',
                  '        tools:targetApi="34">',
                  '',
                  f'        <activity',
                  f'            android:name="{launcher_activity}"',
                  f'            android:exported="true"',
                  f'            android:configChanges="orientation|screenSize|keyboardHidden">',
                  f'            <intent-filter>',
                  f'                <action android:name="android.intent.action.MAIN" />',
                  f'                <category android:name="android.intent.category.LAUNCHER" />',
                  f'            </intent-filter>',
                  f'        </activity>',
                  '',
                  '    </application>',
                  '</manifest>'
              ]
              with open('app/src/main/AndroidManifest.xml', 'w', encoding='utf-8') as f:
                  f.write('\n'.join(manifest_lines) + '\n')
              print('Wrote clean Standalone AndroidManifest.xml with selected permissions:', permissions_list)

          # 6. Decode and apply custom icon (removing adaptive vector icons that override PNGs on Android 8+)
          if icon_base64:
              try:
                  with open('custom_icon.png', 'wb') as f:
                      f.write(base64.b64decode(icon_base64))
                  from PIL import Image, ImageDraw
                  im = Image.open('custom_icon.png').convert('RGBA')

                  import shutil
                  shutil.rmtree('app/src/main/res/mipmap-anydpi-v26', ignore_errors=True)

                  densities = [
                      (48, 'mdpi'),
                      (72, 'hdpi'),
                      (96, 'xhdpi'),
                      (144, 'xxhdpi'),
                      (192, 'xxxhdpi'),
                  ]
                  for size, density in densities:
                      folder = f'app/src/main/res/mipmap-{density}'
                      os.makedirs(folder, exist_ok=True)

                      # Standard square icon
                      square_im = im.resize((size, size), Image.Resampling.LANCZOS)
                      square_im.save(os.path.join(folder, 'ic_launcher.png'), 'PNG')

                      # Round icon with circular mask for round-launcher devices
                      mask = Image.new('L', (size, size), 0)
                      draw = ImageDraw.Draw(mask)
                      draw.ellipse((0, 0, size, size), fill=255)
                      round_im = Image.new('RGBA', (size, size), (0, 0, 0, 0))
                      round_im.paste(square_im, (0, 0), mask)
                      round_im.save(os.path.join(folder, 'ic_launcher_round.png'), 'PNG')

                  print('Custom launcher icons (square + round) created across all densities successfully!')
              except Exception as e:
                  print('Could not process custom icon:', e)

          # 7. Customize splash screen color
          layout_path = 'app/src/main/res/layout/activity_standalone_app.xml'
          if os.path.exists(layout_path):
              with open(layout_path, 'r', encoding='utf-8') as f:
                  layout = f.read()
              if splash_color.upper() == '#FFFFFF':
                  layout = layout.replace('android:background="#1E1E1E"', 'android:background="#FFFFFF"')
                  layout = layout.replace('android:textColor="@color/white"', 'android:textColor="#111111"')
              with open(layout_path, 'w', encoding='utf-8') as f:
                  f.write(layout)
              print('Configured splash screen theme')

          # 8. Export fingerprint to GITHUB_ENV
          if 'GITHUB_ENV' in os.environ and fingerprint:
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as ef:
                  ef.write(f'BUILD_FINGERPRINT={fingerprint}\n')
          EOF

      - name: Generate Gradle wrapper jar (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Standalone APK
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties || true
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p outputs
          cp app/build/outputs/apk/debug/app-debug.apk outputs/standalone-app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-app-apk
          path: outputs/standalone-app.apk
          if-no-files-found: error

      - name: Publish Standalone APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: standalone-build-${{ github.run_number }}
          name: "Standalone App Build #${{ github.run_number }}"
          body: "Fingerprint: ${{ env.BUILD_FINGERPRINT }}"
          files: outputs/standalone-app.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
