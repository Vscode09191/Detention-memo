name: Build Standalone APK

on:
  push:
    paths:
      - 'build_payload/**'
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: false
        default: 'Web App'
      package_id:
        description: 'Package ID'
        required: false
        default: 'com.example.standalone'
      splash_color:
        description: 'Splash Screen Color (#1E1E1E or #FFFFFF)'
        required: false
        default: '#1E1E1E'

permissions:
  contents: write

jobs:
  build:
    name: Compile Standalone Web APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Project Template (if needed)
        run: |
          if [ ! -f app/build.gradle ]; then
            echo "Base project files not found in repo root. Checking for payload template..."
            if [ -f build_payload/template.zip ]; then
              python3 -c "
          import zipfile, os
          with zipfile.ZipFile('build_payload/template.zip', 'r') as z:
              for info in z.infolist():
                  clean = info.filename.replace(chr(92), '/')
                  if clean.endswith('/'):
                      os.makedirs(clean, exist_ok=True)
                  else:
                      dir_name = os.path.dirname(clean)
                      if dir_name:
                          os.makedirs(dir_name, exist_ok=True)
                      with open(clean, 'wb') as f:
                          f.write(z.read(info.filename))
          print('Extracted template successfully!')
          "
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Standalone App (Inject HTML, Icon, Name, Splash)
        run: |
          mkdir -p app/src/main/assets/standalone_app
          pip install --quiet pillow || true

          python3 - << 'EOF'
          import json
          import base64
          import os
          import re

          # 1. Read Payload
          payload_path = 'build_payload/payload.json'
          if os.path.exists(payload_path):
              with open(payload_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
          else:
              data = {}

          app_name = data.get('app_name', 'Web App')
          package_id = data.get('package_id', 'com.app.standalone')
          splash_color = data.get('splash_color', '#1E1E1E')
          html_content = data.get('html_content', '<h1>Hello World</h1>')
          icon_base64 = data.get('icon_base64', '')
          fingerprint = data.get('fingerprint', '')
          project_zip_b64 = data.get('project_zip_base64', '')
          permissions_list = data.get('permissions', ['INTERNET'])
          project_type = data.get('project_type', 'html')

          # 2. Extract Project Assets or HTML into assets/standalone_app/
          os.makedirs('app/src/main/assets/standalone_app', exist_ok=True)
          if project_zip_b64:
              import io, zipfile
              try:
                  zip_bytes = base64.b64decode(project_zip_b64)
                  with zipfile.ZipFile(io.BytesIO(zip_bytes)) as z:
                      z.extractall('app/src/main/assets/standalone_app')
                  print('Successfully unpacked entire project files into assets/standalone_app!')
              except Exception as e:
                  print('Error extracting project ZIP:', e)
                  with open('app/src/main/assets/standalone_app/index.html', 'w', encoding='utf-8') as f:
                      f.write(html_content)
          else:
              with open('app/src/main/assets/standalone_app/index.html', 'w', encoding='utf-8') as f:
                  f.write(html_content)
              print('Injected HTML content into assets/standalone_app/index.html')

          # 2b. If Jetpack Compose project, inject custom Kotlin files into source set
          is_compose = (project_type == 'compose')
          if is_compose:
              for root, dirs, files in os.walk('app/src/main/assets/standalone_app'):
                  for f in files:
                      if f.endswith('.kt'):
                          src_file = os.path.join(root, f)
                          target_file = os.path.join('app/src/main/java/com/example/htmleditor', f)
                          with open(src_file, 'r', encoding='utf-8') as kf:
                              code = kf.read()
                          code = re.sub(r'package\s+[\w\.]+', 'package com.example.htmleditor', code, count=1)
                          code = code.replace('horizontalAlignment = Alignment.CenterVertically', 'horizontalAlignment = Alignment.CenterHorizontally')
                          os.makedirs(os.path.dirname(target_file), exist_ok=True)
                          with open(target_file, 'w', encoding='utf-8') as kf:
                              kf.write(code)
                          print(f'Injected Compose source file: {f}')

          # 3. Set App Name in strings.xml
          os.makedirs('app/src/main/res/values', exist_ok=True)
          with open('app/src/main/res/values/strings.xml', 'w', encoding='utf-8') as f:
              f.write(f'<resources>\n    <string name="app_name">{app_name}</string>\n</resources>\n')
          print('Updated app_name to:', app_name)

          # 4. Update Package ID (applicationId) & Jetpack Compose Configuration in app/build.gradle
          bg_path = 'app/build.gradle'
          if os.path.exists(bg_path):
              with open(bg_path, 'r', encoding='utf-8') as f:
                  bg = f.read()

              if package_id and package_id != 'com.example.htmleditor':
                  bg = re.sub(r'applicationId\s+["\'][^"\']+["\']', f'applicationId "{package_id}"', bg)
                  print('Updated package ID to:', package_id)

              if is_compose:
                  # Enable compose buildFeature
                  if 'compose true' not in bg:
                      if 'buildFeatures {' in bg:
                          bg = bg.replace('buildFeatures {', 'buildFeatures {\n        compose true')
                      else:
                          bg = bg.replace('android {', 'android {\n    buildFeatures {\n        compose true\n    }')

                  # Add composeOptions
                  if 'composeOptions' not in bg:
                      bg = bg.replace('buildFeatures {', "composeOptions {\n        kotlinCompilerExtensionVersion '1.5.14'\n    }\n    buildFeatures {")

                  # Add Jetpack Compose dependencies
                  compose_deps = (
                      "\n    // Jetpack Compose dependencies\n"
                      "    implementation 'androidx.activity:activity-compose:1.9.0'\n"
                      "    implementation platform('androidx.compose:compose-bom:2024.04.01')\n"
                      "    implementation 'androidx.compose.ui:ui'\n"
                      "    implementation 'androidx.compose.ui:ui-graphics'\n"
                      "    implementation 'androidx.compose.ui:ui-tooling-preview'\n"
                      "    implementation 'androidx.compose.material3:material3'\n"
                  )
                  if 'androidx.compose' not in bg:
                      bg = bg.replace('dependencies {', 'dependencies {' + compose_deps)

              with open(bg_path, 'w', encoding='utf-8') as f:
                  f.write(bg)
              print('Configured app/build.gradle (is_compose:', is_compose, ')')

          # 5. Overwrite AndroidManifest.xml with dynamic permissions and appropriate Activity
          if not permissions_list:
              permissions_list = ['INTERNET']

          perm_lines = []
          feat_lines = []

          if 'INTERNET' in permissions_list:
              perm_lines.append('    <uses-permission android:name="android.permission.INTERNET" />')
              perm_lines.append('    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />')

          if 'LOCATION' in permissions_list:
              perm_lines.append('    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />')
              perm_lines.append('    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />')
              feat_lines.append('    <uses-feature android:name="android.hardware.location.gps" android:required="false" />')

          if 'CAMERA' in permissions_list:
              perm_lines.append('    <uses-permission android:name="android.permission.CAMERA" />')
              feat_lines.append('    <uses-feature android:name="android.hardware.camera" android:required="false" />')
              feat_lines.append('    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />')

          if 'AUDIO' in permissions_list:
              perm_lines.append('    <uses-permission android:name="android.permission.RECORD_AUDIO" />')
              perm_lines.append('    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />')
              feat_lines.append('    <uses-feature android:name="android.hardware.microphone" android:required="false" />')

          if 'STORAGE' in permissions_list:
              perm_lines.append('    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />')
              perm_lines.append('    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />')
              perm_lines.append('    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />')
              perm_lines.append('    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />')

          launcher_activity = "com.example.htmleditor.MainActivity" if is_compose else "com.example.htmleditor.StandaloneAppActivity"

          manifest_lines = [
              '<?xml version="1.0" encoding="utf-8"?>',
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android"',
              '    xmlns:tools="http://schemas.android.com/tools">',
              ''
          ] + perm_lines + [''] + feat_lines + [
              '',
              '    <application',
              '        android:allowBackup="true"',
              '        android:icon="@mipmap/ic_launcher"',
              '        android:roundIcon="@mipmap/ic_launcher_round"',
              '        android:label="@string/app_name"',
              '        android:theme="@style/Theme.HtmlEditor"',
              '        android:usesCleartextTraffic="true"',
              '        tools:targetApi="34">',
              '',
              f'        <activity',
              f'            android:name="{launcher_activity}"',
              f'            android:exported="true"',
              f'            android:configChanges="orientation|screenSize|keyboardHidden">',
              f'            <intent-filter>',
              f'                <action android:name="android.intent.action.MAIN" />',
              f'                <category android:name="android.intent.category.LAUNCHER" />',
              f'            </intent-filter>',
              f'        </activity>',
              '',
              '    </application>',
              '</manifest>'
          ]
          with open('app/src/main/AndroidManifest.xml', 'w', encoding='utf-8') as f:
              f.write('\n'.join(manifest_lines) + '\n')
          print('Wrote clean Standalone AndroidManifest.xml with selected permissions:', permissions_list)

          # 6. Decode and apply custom icon (removing adaptive vector icons that override PNGs on Android 8+)
          if icon_base64:
              try:
                  with open('custom_icon.png', 'wb') as f:
                      f.write(base64.b64decode(icon_base64))
                  from PIL import Image, ImageDraw
                  im = Image.open('custom_icon.png').convert('RGBA')

                  import shutil
                  shutil.rmtree('app/src/main/res/mipmap-anydpi-v26', ignore_errors=True)

                  densities = [
                      (48, 'mdpi'),
                      (72, 'hdpi'),
                      (96, 'xhdpi'),
                      (144, 'xxhdpi'),
                      (192, 'xxxhdpi'),
                  ]
                  for size, density in densities:
                      folder = f'app/src/main/res/mipmap-{density}'
                      os.makedirs(folder, exist_ok=True)

                      # Standard square icon
                      square_im = im.resize((size, size), Image.Resampling.LANCZOS)
                      square_im.save(os.path.join(folder, 'ic_launcher.png'), 'PNG')

                      # Round icon with circular mask for round-launcher devices
                      mask = Image.new('L', (size, size), 0)
                      draw = ImageDraw.Draw(mask)
                      draw.ellipse((0, 0, size, size), fill=255)
                      round_im = Image.new('RGBA', (size, size), (0, 0, 0, 0))
                      round_im.paste(square_im, (0, 0), mask)
                      round_im.save(os.path.join(folder, 'ic_launcher_round.png'), 'PNG')

                  print('Custom launcher icons (square + round) created across all densities successfully!')
              except Exception as e:
                  print('Could not process custom icon:', e)

          # 7. Guarantee layout directory and activity_standalone_app.xml exist
          layout_dir = 'app/src/main/res/layout'
          os.makedirs(layout_dir, exist_ok=True)
          layout_path = os.path.join(layout_dir, 'activity_standalone_app.xml')
          if not os.path.exists(layout_path) or os.path.getsize(layout_path) == 0:
              default_layout = '''<?xml version="1.0" encoding="utf-8"?>
<FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:background="#000000">

    <WebView
        android:id="@+id/standaloneWebView"
        android:layout_width="match_parent"
        android:layout_height="match_parent" />

    <ProgressBar
        android:id="@+id/standaloneProgress"
        style="?android:attr/progressBarStyleHorizontal"
        android:layout_width="match_parent"
        android:layout_height="3dp"
        android:layout_gravity="top"
        android:indeterminate="false"
        android:progressTint="#4FC3F7"
        android:visibility="gone" />

    <LinearLayout
        android:id="@+id/splashContainer"
        android:layout_width="match_parent"
        android:layout_height="match_parent"
        android:orientation="vertical"
        android:gravity="center"
        android:background="#1E1E1E">

        <ImageView
            android:id="@+id/splashLogo"
            android:layout_width="100dp"
            android:layout_height="100dp"
            android:src="@mipmap/ic_launcher"
            android:contentDescription="App Logo" />

        <TextView
            android:id="@+id/splashTitle"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:layout_marginTop="16dp"
            android:text="@string/app_name"
            android:textColor="#FFFFFF"
            android:textSize="18sp"
            android:textStyle="bold" />
    </LinearLayout>

</FrameLayout>
'''
              with open(layout_path, 'w', encoding='utf-8') as lf:
                  lf.write(default_layout)
              print('Generated default activity_standalone_app.xml')

          # Apply splash screen customization to XML
          if os.path.exists(layout_path):
              with open(layout_path, 'r', encoding='utf-8') as f:
                  layout = f.read()
              if splash_color.upper() == '#FFFFFF':
                  layout = layout.replace('android:background="#1E1E1E"', 'android:background="#FFFFFF"')
                  layout = layout.replace('android:textColor="@color/white"', 'android:textColor="#111111"')
                  layout = layout.replace('android:textColor="#FFFFFF"', 'android:textColor="#111111"')
              with open(layout_path, 'w', encoding='utf-8') as f:
                  f.write(layout)
              print('Configured splash screen theme in layout')

          # Also heal StandaloneAppActivity.kt against any missing R.layout or R.id references
          standalone_kt = 'app/src/main/java/com/example/htmleditor/StandaloneAppActivity.kt'
          if os.path.exists(standalone_kt):
              with open(standalone_kt, 'r', encoding='utf-8') as skf:
                  s_code = skf.read()
              if 'R.layout.activity_standalone_app' in s_code or 'R.id.standaloneWebView' in s_code:
                  programmatic_code = '''package com.example.htmleditor

import android.annotation.SuppressLint
import android.graphics.Color
import android.graphics.Typeface
import android.os.Bundle
import android.view.Gravity
import android.view.View
import android.view.ViewGroup
import android.view.animation.AlphaAnimation
import android.webkit.WebChromeClient
import android.webkit.WebView
import android.webkit.WebViewClient
import android.widget.FrameLayout
import android.widget.ImageView
import android.widget.LinearLayout
import android.widget.ProgressBar
import android.widget.TextView
import androidx.activity.OnBackPressedCallback
import androidx.appcompat.app.AppCompatActivity

class StandaloneAppActivity : AppCompatActivity() {

    private lateinit var webView: WebView
    private lateinit var splashContainer: LinearLayout
    private lateinit var progressBar: ProgressBar
    private var splashDismissed = false

    @SuppressLint("SetJavaScriptEnabled")
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        val density = resources.displayMetrics.density

        val rootLayout = FrameLayout(this).apply {
            layoutParams = ViewGroup.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.MATCH_PARENT
            )
            setBackgroundColor(Color.BLACK)
        }

        webView = WebView(this).apply {
            layoutParams = FrameLayout.LayoutParams(
                FrameLayout.LayoutParams.MATCH_PARENT,
                FrameLayout.LayoutParams.MATCH_PARENT
            )
        }
        rootLayout.addView(webView)

        progressBar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
            layoutParams = FrameLayout.LayoutParams(
                FrameLayout.LayoutParams.MATCH_PARENT,
                (3 * density).toInt()
            ).apply {
                gravity = Gravity.TOP
            }
            isIndeterminate = false
            progressTintList = android.content.res.ColorStateList.valueOf(Color.parseColor("#4FC3F7"))
            visibility = View.GONE
        }
        rootLayout.addView(progressBar)

        val splashBgColor = if ("''' + splash_color.upper() + '''" == "#FFFFFF") Color.WHITE else Color.parseColor("#1E1E1E")
        val splashTextColor = if ("''' + splash_color.upper() + '''" == "#FFFFFF") Color.parseColor("#111111") else Color.WHITE

        splashContainer = LinearLayout(this).apply {
            layoutParams = FrameLayout.LayoutParams(
                FrameLayout.LayoutParams.MATCH_PARENT,
                FrameLayout.LayoutParams.MATCH_PARENT
            )
            orientation = LinearLayout.VERTICAL
            gravity = Gravity.CENTER
            setBackgroundColor(splashBgColor)
        }

        val splashIcon = ImageView(this).apply {
            val iconSize = (100 * density).toInt()
            layoutParams = LinearLayout.LayoutParams(iconSize, iconSize)
            try {
                setImageDrawable(packageManager.getApplicationIcon(applicationInfo))
            } catch (e: Exception) {}
            contentDescription = "App Logo"
        }
        splashContainer.addView(splashIcon)

        val splashTitle = TextView(this).apply {
            layoutParams = LinearLayout.LayoutParams(
                LinearLayout.LayoutParams.WRAP_CONTENT,
                LinearLayout.LayoutParams.WRAP_CONTENT
            ).apply {
                topMargin = (16 * density).toInt()
            }
            text = try {
                packageManager.getApplicationLabel(applicationInfo).toString()
            } catch (e: Exception) {
                "App"
            }
            setTextColor(splashTextColor)
            textSize = 18f
            typeface = Typeface.DEFAULT_BOLD
        }
        splashContainer.addView(splashTitle)

        rootLayout.addView(splashContainer)

        setContentView(rootLayout)

        webView.settings.javaScriptEnabled = true
        webView.settings.domStorageEnabled = true
        webView.settings.databaseEnabled = true
        webView.settings.allowFileAccess = true
        webView.settings.allowFileAccessFromFileURLs = true
        webView.settings.allowUniversalAccessFromFileURLs = true
        webView.settings.loadWithOverviewMode = true
        webView.settings.useWideViewPort = true
        webView.settings.mediaPlaybackRequiresUserGesture = false
        webView.settings.setGeolocationEnabled(true)
        webView.settings.mixedContentMode = android.webkit.WebSettings.MIXED_CONTENT_ALWAYS_ALLOW

        webView.webChromeClient = object : WebChromeClient() {
            override fun onProgressChanged(view: WebView?, newProgress: Int) {
                progressBar.progress = newProgress
                if (newProgress >= 100) {
                    progressBar.visibility = View.GONE
                    dismissSplash()
                } else {
                    progressBar.visibility = View.VISIBLE
                }
            }

            override fun onGeolocationPermissionsShowPrompt(
                origin: String?,
                callback: android.webkit.GeolocationPermissions.Callback?
            ) {
                callback?.invoke(origin, true, false)
            }

            override fun onPermissionRequest(request: android.webkit.PermissionRequest?) {
                request?.let { req ->
                    runOnUiThread {
                        req.grant(req.resources)
                    }
                }
            }
        }

        webView.webViewClient = object : WebViewClient() {
            override fun onPageFinished(view: WebView?, url: String?) {
                dismissSplash()
            }
        }

        onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
            override fun handleOnBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack()
                } else {
                    finish()
                }
            }
        })

        val localHtml = java.io.File(filesDir, "standalone_app/index.html")
        if (localHtml.exists()) {
            webView.loadUrl("file://${localHtml.absolutePath}")
        } else {
            webView.loadUrl("file:///android_asset/standalone_app/index.html")
        }

        splashContainer.postDelayed({ dismissSplash() }, 3000)
    }

    private fun dismissSplash() {
        if (!splashDismissed) {
            splashDismissed = true
            val fadeOut = AlphaAnimation(1f, 0f).apply {
                duration = 400
                setAnimationListener(object : android.view.animation.Animation.AnimationListener {
                    override fun onAnimationStart(a: android.view.animation.Animation?) {}
                    override fun onAnimationEnd(a: android.view.animation.Animation?) {
                        splashContainer.visibility = View.GONE
                    }
                    override fun onAnimationRepeat(a: android.view.animation.Animation?) {}
                })
            }
            splashContainer.startAnimation(fadeOut)
        }
    }
}
'''
                  with open(standalone_kt, 'w', encoding='utf-8') as skf:
                      skf.write(programmatic_code)
                  print('Self-healed StandaloneAppActivity.kt with robust programmatic layout!')


          # 8. Export fingerprint to GITHUB_ENV
          if 'GITHUB_ENV' in os.environ and fingerprint:
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as ef:
                  ef.write(f'BUILD_FINGERPRINT={fingerprint}\n')
          EOF

      - name: Generate Gradle wrapper jar (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Standalone APK
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties || true
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p outputs
          cp app/build/outputs/apk/debug/app-debug.apk outputs/standalone-app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-app-apk
          path: outputs/standalone-app.apk
          if-no-files-found: error

      - name: Publish Standalone APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: standalone-build-${{ github.run_number }}
          name: "Standalone App Build #${{ github.run_number }}"
          body: "Fingerprint: ${{ env.BUILD_FINGERPRINT }}"
          files: outputs/standalone-app.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
